name: Claude Jira

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Jira ticket ID (e.g., TASKS-123)'
        required: true
        type: string
      summary:
        description: 'Ticket summary'
        required: true
        type: string
      description:
        description: 'Ticket description'
        required: true
        type: string

jobs:
  implement:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: virendersinghdogra/claude-workflows/.github/workflows/claude-jira.yml@main
    with:
      ticket_id: ${{ inputs.ticket_id }}
      summary: ${{ inputs.summary }}
      description: ${{ inputs.description }}
      install_command: 'pip install uv && uv sync'
      allowed_tools: 'Read,Edit,Write,Grep,Glob,Bash(uv sync:*),Bash(uv run pytest:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git branch:*),Bash(git diff:*),Bash(git log:*)'
    secrets: inherit
